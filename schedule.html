<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Schedule | Fourplay Dance Band</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="nav.js"></script>
</head>

<body>
<div class="page">

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="index.html" aria-label="Fourplay Home">
          <img src="assets/logo.png" alt="FOURPLAY" class="header-logo" />
        </a>
        <div class="site-title-small">FOURPLAY DANCE BAND</div>
      </div>

      <!-- ✅ Hamburger -->
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" aria-label="Primary Navigation">
        <a href="index.html">Home</a>
        <a href="members.html">Members</a>
        <a href="artists.html">Artists We Cover</a>
        <a href="videos.html">Videos</a>
        <a href="photos.html">Photos</a>
        <a href="schedule.html" class="active">Schedule</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <section class="section-narrow">
      <div class="page-header">
        <h1>Schedule</h1>
        <p>Upcoming shows for 2026.</p>
      </div>

      <div class="calendar-wrapper">
        <div class="calendar-panel">
          <div class="calendar-panel-header">
            <h2 class="calendar-title" id="calendar-title">2026</h2>
            <p class="calendar-hint">Click a show to see details</p>
          </div>

          <!-- legend removed per request: dots now appear on each event -->

          <div class="upcoming-wrapper">
            <div class="featured-show" id="featured-show" aria-live="polite"></div>
            <ul class="upcoming-shows" id="shows-list" aria-live="polite"></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Event details modal -->
  <div class="event-modal" id="event-modal" aria-hidden="true">
    <div class="event-modal__backdrop" data-close="true"></div>
    <div class="event-modal__panel" role="dialog" aria-modal="true" aria-label="Event details">
      <button class="event-modal__close" type="button" id="event-modal-close" aria-label="Close">✕</button>
      <h3 class="event-modal__title" id="event-title">Event</h3>
      <p class="event-modal__meta" id="event-meta"></p>
      <p class="event-modal__note" id="event-note"></p>
    </div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const YEAR = 2026;

    const showsList = document.getElementById('shows-list');

    // Try to load CMS schedule data for the year from common locations
    async function loadSchedule(year){
      const candidates = [
        `content/schedule/${year}.json`,
        `/content/schedule/${year}.json`,
        `content/schedule.json`,
        `/content/schedule.json`
      ];

      for (const url of candidates){
        try{
          const res = await fetch(url, { cache: 'no-store' });
          if (!res || !res.ok) continue;
          const json = await res.json();
          // expected shape: { year: 2026, events: [ { date, location, members: [] }, ... ] }
          if (json && Array.isArray(json.events)) return json.events;
          // allow top-level array as fallback
          if (Array.isArray(json)) return json;
        }catch(e){ /* try next */ }
      }
      return null;
    }

    function renderShows(events){
      showsList.innerHTML = '';
      const featuredEl = document.getElementById('featured-show');
      if (featuredEl) featuredEl.innerHTML = '';
      if (!events || !events.length){
        showsList.innerHTML = '<li class="no-shows">No upcoming shows listed for 2026.</li>';
        return;
      }

      events.sort((a,b)=> (a.date||'').localeCompare(b.date||''));

      events.forEach((ev, idx) => {
        const li = document.createElement('li');
        li.className = 'show-item';
        const members = Array.isArray(ev.members) ? ev.members.join(', ') : '';
        li.innerHTML = `
          <div class="show-row">
            <span class="show-dot booked" aria-hidden="true"></span>
            <div class="show-date">${ev.date || ''}</div>
            <div class="show-location">${ev.location || ''}</div>
            <div class="show-members">${members}</div>
          </div>
        `;
        showsList.appendChild(li);
        // render the first event as featured
        if (idx === 0 && featuredEl){
          featuredEl.innerHTML = `
            <div class="featured-panel">
              <span class="show-dot booked" aria-hidden="true"></span>
              <div class="featured-date">${ev.date || ''}</div>
              <div class="featured-venue">${ev.location || ''}</div>
              <div class="featured-members">${members}</div>
            </div>
          `;
        }
      });
    }

    (async function(){
      const events = await loadSchedule(YEAR);
      if (!events) {
        // fallback to inline examples if no CMS file found
        renderShows([
          { date: '2026-01-24', location: 'R PLACE', members: ['Taryn McCallum','Robby Rottin','Jeff Pavon'] },
          { date: '2026-05-08', location: 'The Forum', members: ['Taryn McCallum','Adam Rogers','Mark Carlson'] }
        ]);
        return;
      }
      renderShows(events);
    })();
  });
  </script>

  <footer class="site-footer">
    © 2025 Fourplay Dance Band. All rights reserved.
  </footer>

</body>
</html>
