<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FOURPLAY Dance Band</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="nav.js"></script>
  </head>

  <body class="home">
    <div class="page">
      <!-- Header -->
      <header class="site-header">
        <div class="header-inner">
          <div class="header-left">
            <a href="index.html" aria-label="Fourplay Home">
              <img class="header-logo" src="assets/logo.png" alt="FOURPLAY" />
            </a>
            <div class="site-title-small">FOURPLAY DANCE BAND</div>
          </div>

          <!-- ✅ Hamburger -->
          <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>

          <nav class="nav" aria-label="Primary Navigation">
            <a href="index.html" class="active">Home</a>
            <a href="members.html">Members</a>
            <a href="artists.html">Artists We Cover</a>
            <a href="videos.html">Videos</a>
            <a href="photos.html">Photos</a>
            <a href="schedule.html">Schedule</a>
            <a href="contact.html">Contact</a>
          </nav>
        </div>
      </header>

      <!-- Main -->
      <main class="home-main">
        <section class="hero-video-full" aria-label="Hero">
          <!-- Fullscreen Loop Video -->
          <video
            class="hero-video"
            src="assets/logo-bg.mp4"
            autoplay
            muted
            loop
            playsinline
          ></video>

          <div class="hero-inner">
            <img class="hero-logo" src="assets/logo.png" alt="FOURPLAY DANCE BAND" />
            <div class="hero-tagline">PLAY CURRENT DANCE HITS</div>

            <div class="hero-buttons">
              <a class="btn btn-primary" href="videos.html">Watch Videos</a>

              <button class="music-toggle playing" id="musicToggle" aria-label="Toggle music">
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5v14l11-7z"></path>
                </svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 5h5v14H6zM13 5h5v14h-5z"></path>
                </svg>
              </button>

              <a class="btn btn-secondary" href="contact.html">Contact Us</a>
            </div>
          </div>

          <audio id="bgm" src="assets/bgm.mp3" preload="auto" loop></audio>

          <script>
            (function () {
              const audio = document.getElementById("bgm");
              const btn = document.getElementById("musicToggle");

              function setPlaying(isPlaying) {
                btn.classList.toggle("playing", isPlaying);
                btn.setAttribute("aria-pressed", String(isPlaying));
              }

              async function tryAutoPlay() {
                try {
                  await audio.play();
                  setPlaying(true);
                } catch (e) {
                  setPlaying(false);

                  const unlock = async () => {
                    try {
                      await audio.play();
                      setPlaying(true);
                    } catch (_) {}
                    document.removeEventListener("click", unlock, true);
                    document.removeEventListener("touchstart", unlock, true);
                  };

                  document.addEventListener("click", unlock, true);
                  document.addEventListener("touchstart", unlock, true);
                }
              }

              btn.addEventListener("click", async (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (audio.paused) {
                  try {
                    await audio.play();
                    setPlaying(true);
                  } catch (_) {
                    setPlaying(false);
                  }
                } else {
                  audio.pause();
                  setPlaying(false);
                }
              });

              tryAutoPlay();
            })();
          </script>
        </section>
      </main>

      <!-- Footer -->
      <footer class="site-footer">
        © 2025 Fourplay Dance Band. All rights reserved.
      </footer>
    </div>
  </body>
</html>
