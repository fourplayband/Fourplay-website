<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fourplay Dance Band | Members</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />

  <!-- IMPORTANT: load nav.js so header/footer (and hamburger) work the same as other pages -->
  <script src="nav.js" defer></script>

  <style>
    /* ===== Members page layout only (safe, won't affect other pages) ===== */
    .members-page-wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 44px 18px 60px;
    }

    /* Top band section: left photo + right bio */
    .band-top{
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 26px;
      align-items: start;
      margin-bottom: 26px;
    }
    .band-photo{
      width: 100%;
      border-radius: 18px;
      display: block;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
    }
    .band-bio-card{
      border-radius: 18px;
      padding: 18px 18px 16px;
      background: rgba(10, 10, 30, 0.42);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
    }
    .band-bio-title{
      margin: 0 0 10px;
      letter-spacing: 2px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .band-bio-text{
      margin: 0;
      line-height: 1.55;
      font-size: 14px; /* smaller than before */
      opacity: .95;
      white-space: pre-wrap;
    }

    /* Members row (5 across on desktop) */
    .members-grid{
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .member-card{
      border-radius: 18px;
      padding: 16px 14px 14px;
      text-align: center;
      background: rgba(10, 10, 30, 0.42);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
      min-height: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .member-avatar{
      width: 86px;
      height: 86px;
      border-radius: 999px;
      object-fit: cover;
      display: block;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border: 3px solid rgba(255,255,255,.12);
      margin-top: -28px; /* pop up like your screenshot */
      background: rgba(0,0,0,.2);
    }

    .member-name{
      margin: 12px 0 2px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 14px;
    }

    .member-role{
      margin: 0 0 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 12px;
      opacity: .75;
    }

    .member-bio{
      margin: 0;
      font-size: 12.5px;
      line-height: 1.45;
      opacity: .92;
      white-space: pre-wrap;
    }

    /* Responsive */
    @media (max-width: 1024px){
      .band-top{ grid-template-columns: 1fr; }
      .members-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .member-avatar{ margin-top: 0; }
    }
    @media (max-width: 560px){
      .members-grid{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="members">
  <div class="page">
    <!-- Header injected by nav.js -->
    <header id="site-header"></header>

    <main class="main-content">
      <div class="members-page-wrap">
        <section class="band-top">
          <div>
            <img id="bandPhoto" class="band-photo" alt="Fourplay Dance Band" />
          </div>

          <div class="band-bio-card">
            <h2 class="band-bio-title">The Players</h2>
            <p id="bandBio" class="band-bio-text"></p>
          </div>
        </section>

        <section>
          <div id="membersGrid" class="members-grid"></div>
        </section>
      </div>
    </main>

    <!-- Footer injected by nav.js -->
    <footer id="site-footer"></footer>
  </div>

  <script>
    async function loadMembers() {
      // Your JSON lives at: content/members.json (repo root)
      // Netlify serves it at: /content/members.json
      const res = await fetch("/content/members.json", { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load /content/members.json");
      const data = await res.json();

      // Top band content
      const bandPhotoEl = document.getElementById("bandPhoto");
      const bandBioEl = document.getElementById("bandBio");

      bandPhotoEl.src = data.bandPhoto || "";
      bandBioEl.textContent = data.bandBio || "";

      // Members cards
      const grid = document.getElementById("membersGrid");
      grid.innerHTML = "";

      const members = Array.isArray(data.members) ? data.members : [];
      members.forEach(m => {
        const card = document.createElement("div");
        card.className = "member-card";

        const img = document.createElement("img");
        img.className = "member-avatar";
        img.alt = m.name || "Member";
        img.src = m.photo || "";

        const name = document.createElement("div");
        name.className = "member-name";
        name.textContent = (m.name || "").toUpperCase();

        const role = document.createElement("div");
        role.className = "member-role";
        role.textContent = (m.role || "").toUpperCase();

        const bio = document.createElement("p");
        bio.className = "member-bio";
        bio.textContent = m.bio || "";   // <-- bio will show here

        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(role);
        card.appendChild(bio);

        grid.appendChild(card);
      });
    }

    loadMembers().catch(err => {
      console.error(err);
      // keep page usable even if json fails
    });
  </script>
</body>
</html>
