<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fourplay Dance Band | Members</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />

  <!-- 你的汉堡菜单脚本 -->
  <script src="nav.js" defer></script>

  <style>
    /* ===== Members page layout fixes (only this page) ===== */
    body.members-page .page{
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body.members-page .main-content{ flex: 1; }

    /* Sticky header */
    body.members-page header.site-header{
      position: sticky;
      top: 0;
      z-index: 9999;
    }

    /* Content wrap */
    body.members-page .members-wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 18px 60px;
    }

    /* Top band photo + bio */
    body.members-page .band-top{
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 26px;
      align-items: start;
      margin-bottom: 18px;
    }
    body.members-page .band-photo{
      width: 100%;
      display: block;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
    }
    body.members-page .band-bio-card{
      border-radius: 18px;
      padding: 18px 18px 16px;
      background: rgba(10, 10, 30, 0.42);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
    }
    body.members-page .band-title{
      margin: 0 0 10px;
      letter-spacing: 2px;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 28px;
    }
    body.members-page .band-bio{
      margin: 0;
      line-height: 1.55;
      font-size: 14px; /* smaller */
      opacity: .95;
      white-space: pre-wrap;
    }

    /* Members grid: 5 across desktop */
    body.members-page .members-grid{
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
      margin-top: 14px;
    }
    body.members-page .member-card{
      border-radius: 18px;
      padding: 16px 14px 14px;
      text-align: center;
      background: rgba(10, 10, 30, 0.42);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    body.members-page .member-avatar{
      width: 86px;
      height: 86px;
      border-radius: 999px;
      object-fit: cover;
      display: block;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border: 3px solid rgba(255,255,255,.12);
      margin-top: -28px;
      background: rgba(0,0,0,.2);
    }
    body.members-page .member-name{
      margin: 12px 0 2px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 14px;
    }
    body.members-page .member-role{
      margin: 0 0 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 12px;
      opacity: .75;
    }
    body.members-page .member-bio{
      margin: 0;
      font-size: 12.5px;
      line-height: 1.45;
      opacity: .92;
      white-space: pre-wrap;
    }

    /* Responsive */
    @media (max-width: 1024px){
      body.members-page .band-top{ grid-template-columns: 1fr; }
      body.members-page .members-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
      body.members-page .member-avatar{ margin-top: 0; }
    }
    @media (max-width: 560px){
      body.members-page .members-grid{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="members-page">
  <div class="page">

    <!-- ✅ REAL header (same structure as your other pages) -->
    <header class="site-header">
      <div class="header-inner">
        <div class="header-left">
          <a href="index.html">
            <img src="assets/logo.png" alt="Fourplay Dance Band" class="header-logo" />
          </a>
          <div class="site-title-small">FOURPLAY DANCE BAND</div>
        </div>

        <!-- 汉堡菜单按钮 -->
        <button class="nav-toggle" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>

        <!-- 导航菜单 -->
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="members.html" class="active">Members</a>
          <a href="artists.html">Artists</a>
          <a href="videos.html">Videos</a>
          <a href="photos.html">Photos</a>
          <a href="schedule.html">Schedule</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="members-wrap">

        <section class="band-top">
          <div>
            <img id="bandPhoto" class="band-photo" alt="Fourplay Dance Band" />
          </div>

          <div class="band-bio-card">
            <h2 class="band-title">Band Members</h2>
            <p id="bandBio" class="band-bio"></p>
          </div>
        </section>

        <section>
          <div id="membersGrid" class="members-grid"></div>
        </section>

      </div>
    </main>

    <!-- ✅ REAL footer -->
    <footer class="site-footer">
      © 2025 Fourplay Dance Band. All rights reserved.
    </footer>

  </div>

  <script>
    async function loadMembers() {
      const res = await fetch("/content/members.json", { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load /content/members.json");
      const data = await res.json();

      document.getElementById("bandPhoto").src = data.bandPhoto || "";
      document.getElementById("bandBio").textContent = data.bandBio || "";

      const grid = document.getElementById("membersGrid");
      grid.innerHTML = "";

      const members = Array.isArray(data.members) ? data.members : [];
      members.forEach(m => {
        const card = document.createElement("div");
        card.className = "member-card";

        const img = document.createElement("img");
        img.className = "member-avatar";
        img.alt = m.name || "Member";
        img.src = m.photo || "";

        const name = document.createElement("div");
        name.className = "member-name";
        name.textContent = (m.name || "").toUpperCase();

        const role = document.createElement("div");
        role.className = "member-role";
        role.textContent = (m.role || "").toUpperCase();

        const bio = document.createElement("p");
        bio.className = "member-bio";
        bio.textContent = m.bio || "";   // ✅ 这里就是每个人的 bio

        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(role);
        card.appendChild(bio);

        grid.appendChild(card);
      });
    }

    loadMembers().catch(console.error);
  </script>
</body>
</html>
