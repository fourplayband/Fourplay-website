<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fourplay Dance Band | Members</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="members-page">

<!-- ================= HEADER ================= -->
<header class="site-header fixed">
  <div class="header-inner">
    <div class="header-left">
      <a href="index.html">
        <img src="assets/logo.png" class="header-logo" alt="Fourplay Dance Band" />
      </a>
      <span class="site-title-small">FOURPLAY DANCE BAND</span>
    </div>

    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="members.html" class="active">Members</a>
      <a href="artists.html">Artists</a>
      <a href="videos.html">Videos</a>
      <a href="photos.html">Photos</a>
      <a href="schedule.html">Schedule</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="main-content">

  <!-- ===== Top Band Section ===== -->
  <section class="band-top">

    <div class="band-photo-card">
      <img id="bandPhoto" class="band-photo" alt="Fourplay Dance Band" />
    </div>

    <div class="band-bio-card">
      <h2 class="band-title">Band Members</h2>
      <p id="bandBio" class="band-bio"></p>
    </div>

  </section>

  <!-- ===== Members Grid ===== -->
  <section class="members-grid" id="membersGrid"></section>

</main>

<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  © 2025 Fourplay Dance Band. All rights reserved.
</footer>

<!-- ================= SCRIPT ================= -->
<script src="nav.js"></script>

<script>
fetch('/content/members.json')
  .then(res => res.json())
  .then(data => {

    document.getElementById('bandPhoto').src = data.bandPhoto;
    document.getElementById('bandBio').textContent = data.bandBio;

    const grid = document.getElementById('membersGrid');

    data.members.forEach(m => {
      const card = document.createElement('div');
      card.className = 'member-card';

      card.innerHTML = `
        <img src="${m.photo}" alt="${m.name}">
        <h3>${m.name}</h3>
        <p class="role">${m.role}</p>
        ${m.bio ? `<p class="bio">${m.bio}</p>` : ``}
      `;

      grid.appendChild(card);
    });
  });
</script>

<!-- ================= PAGE STYLE ================= -->
<style>
/* ===== Layout base ===== */
body.members-page {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

main.main-content {
  flex: 1;
  padding-top: 96px; /* header height */
}

/* ===== Header fixed ===== */
.site-header.fixed {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
}

/* ===== Top section ===== */
.band-top {
  max-width: 1200px;
  margin: 0 auto 40px;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 28px;
  align-items: stretch;
}

.band-photo-card,
.band-bio-card {
  background: rgba(10,10,30,.42);
  backdrop-filter: blur(8px);
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 18px 40px rgba(0,0,0,.22);
}

.band-photo-card {
  padding: 12px;
  display: flex;
}

.band-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 14px;
}

.band-bio-card {
  padding: 20px 22px;
}

.band-title {
  margin-bottom: 12px;
}

.band-bio {
  font-size: 0.95rem;
  line-height: 1.6;
  opacity: .95;
}

/* ===== Members grid ===== */
.members-grid {
  max-width: 1200px;
  margin: 0 auto 60px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 22px;
}

.member-card {
  background: rgba(20,20,60,.45);
  border-radius: 18px;
  padding: 18px 14px;
  text-align: center;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.member-card img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 10px;
}

.member-card h3 {
  font-size: .95rem;
  margin: 6px 0 2px;
}

.member-card .role {
  font-size: .8rem;
  opacity: .8;
  margin-bottom: 6px;
}

.member-card .bio {
  font-size: .78rem;
  opacity: .75;
  line-height: 1.4;
}

/* ===== Responsive ===== */
@media (max-width: 900px) {
  .band-top {
    grid-template-columns: 1fr;
  }

  .members-grid {
    grid-template-columns: 1fr;
  }
}
</style>

</body>
</html>
