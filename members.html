<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Members | FOURPLAY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page">

  <!-- 你的 header 保持原样（如果 members.html 里已经有就留着） -->


  <main class="main-content members-page">

    <!-- Top: 左图右文 -->
    <section class="members-hero">
      <div class="members-hero-photoWrap">
        <img id="bandPhoto" class="members-hero-photo" alt="Band Photo" />
      </div>

      <div class="members-hero-text">
        <h1 class="members-hero-title">The Players</h1>
        <p id="bandBio" class="members-hero-bio"></p>
      </div>
    </section>

    <!-- 5 人并排 -->
    <section class="members-grid" id="membersGrid"></section>

  </main>

  <!-- 你的 footer 保持原样 -->

</div>

<script>
fetch('/content/members.json')
  .then(r => r.json())
  .then(data => {
    // top section
    const bandPhotoEl = document.getElementById('bandPhoto');
    const bandBioEl = document.getElementById('bandBio');

    bandPhotoEl.src = data.bandPhoto || '';
    bandBioEl.textContent = data.bandBio || '';

    // order members: singer in center
    const singer = (data.members || []).find(m => m.isSinger);
    const others = (data.members || []).filter(m => !m.isSinger);

    // fallback: 如果没标 singer，就按原顺序
    const ordered = singer && others.length >= 4
      ? [others[0], others[1], singer, others[2], others[3]]
      : (data.members || []);

    const grid = document.getElementById('membersGrid');
    grid.innerHTML = '';

    ordered.forEach(m => {
      const card = document.createElement('article');
      card.className = 'member-card' + (m.isSinger ? ' singer' : '');

      card.innerHTML = `
        <div class="member-avatarWrap">
          <img class="member-avatar" src="${m.photo || ''}" alt="${m.name || ''}">
        </div>

        <h3 class="member-name">${m.name || ''}</h3>
        <div class="member-role">${m.role || ''}</div>
        <p class="member-bio">${m.bio || ''}</p>
      `;

      grid.appendChild(card);
    });
  });
</script>

</body>
</html>
