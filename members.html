<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Members | Fourplay Dance Band</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="nav.js"></script>
</head>

<body>
<div class="page">

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="index.html" aria-label="Fourplay Home">
          <img src="assets/logo.png" alt="FOURPLAY" class="header-logo" />
        </a>
        <div class="site-title-small">FOURPLAY DANCE BAND</div>
      </div>

      <!-- ✅ Hamburger -->
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" aria-label="Primary Navigation">
        <a href="index.html">Home</a>
        <a href="members.html" class="active">Members</a>
        <a href="artists.html">Artists We Cover</a>
        <a href="videos.html">Videos</a>
        <a href="photos.html">Photos</a>
        <a href="schedule.html">Schedule</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <section class="section-narrow">
      <div class="page-header">
        <h1>Members</h1>
        <p>Meet the band.</p>
      </div>

      <div class="panel" style="padding:16px;">
        <img id="band-photo" class="band-photo" src="" alt="Band Photo" style="width:100%;height:auto;border-radius:14px;border:1px solid rgba(255,255,255,0.10);"/>
        <p id="band-bio" class="band-bio" style="margin-top:14px;text-align:left;opacity:.9;line-height:1.6;"></p>
      </div>

      <div style="height:50px;"></div>

      <div class="members-grid" id="membersGrid" style="display:grid;grid-template-columns: repeat(5, 1fr);gap: 16px;"></div>
    </section>
  </main>

  <footer class="site-footer">
    © 2025 Fourplay Dance Band. All rights reserved.
  </footer>
</div>

<!-- Bio Modal -->
<div class="bio-modal" id="bioModal">
  <div class="bio-modal__backdrop" data-close="1"></div>
  <div class="bio-modal__dialog" role="dialog" aria-modal="true">
    <button class="bio-modal__close" type="button" aria-label="Close" data-close="1">×</button>
    <div class="bio-modal__header">
      <img class="bio-modal__photo" id="bioModalPhoto" alt="" />
      <div class="bio-modal__meta">
        <h3 class="bio-modal__name" id="bioModalName"></h3>
        <p class="bio-modal__role" id="bioModalRole"></p>
      </div>
    </div>
    <div class="bio-modal__body" id="bioModalBody"></div>
  </div>
</div>

<script>
(async function () {
  try {
    const res = await fetch("/content/members.json", { cache: "no-store" });
    const data = await res.json();

    document.getElementById("band-photo").src = data.bandPhoto || "";
    document.getElementById("band-bio").textContent = data.bandBio || "";

    const grid = document.getElementById("membersGrid");
    grid.innerHTML = "";

    // ✅ NEW STRUCTURE: data.members (your CMS now)
    if (Array.isArray(data.members)) {
      data.members.forEach(m => {
        const card = document.createElement("div");
        card.className = "member-card";
        card.style.position = "relative";
        card.style.paddingTop = "80px";
        card.style.borderRadius = "16px";
        card.style.background = "rgba(255,255,255,0.10)";
        card.style.border = "1px solid rgba(255,255,255,0.14)";
        card.style.backdropFilter = "blur(8px)";
        card.style.boxShadow = "0 12px 30px rgba(0,0,0,0.28)";
        card.style.textAlign = "center";
        
        // Store full bio in data attribute for modal
        card.dataset.fullBio = m.bio || "";

        card.innerHTML = `
          <div class="member-avatarWrap" style="
            position:absolute; top:-34px; left:50%; transform:translateX(-50%);
            width:86px; height:86px; border-radius:999px; padding:4px;
            background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.22);
          ">
            <img class="member-avatar" src="${m.photo || ""}" alt="${m.name || ""}" style="
              width:100%;height:100%;border-radius:999px;object-fit:cover;display:block;
            "/>
          </div>
          <div class="member-name" style="margin:8px 0 6px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:rgba(255,255,255,0.90);">
            ${m.name || ""}
          </div>
          <div class="member-role" style="font-size:.85rem;opacity:.78;margin-bottom:8px;">
            ${m.role || ""}
          </div>
          <div class="member-bio" style="font-size:.86rem;line-height:1.45;opacity:.86;text-align:left;">
            ${m.bio ? m.bio : ""}
          </div>
          <button class="bio-toggle">More</button>
        `;
        // mark Taryn for special styling and ordering
        if ((m.name || '').toLowerCase().includes('taryn')) {
          card.classList.add('member--taryn');
        }

        grid.appendChild(card);
      });
      return;
    }

    // ✅ OLD STRUCTURE fallback: data.musicians + data.singer
    const all = [];
    if (Array.isArray(data.musicians)) all.push(...data.musicians);
    if (data.singer) all.splice(2, 0, data.singer); // singer in middle

    all.forEach(m => {
      const card = document.createElement("div");
      card.className = "member-card";
      card.style.position = "relative";
      card.style.paddingTop = "80px";
      card.style.borderRadius = "16px";
      card.style.background = "rgba(255,255,255,0.10)";
      card.style.border = "1px solid rgba(255,255,255,0.14)";
      card.style.backdropFilter = "blur(8px)";
      card.style.boxShadow = "0 12px 30px rgba(0,0,0,0.28)";
      card.style.textAlign = "center";
      
      // Store full bio in data attribute for modal
      card.dataset.fullBio = m.bio || "";

      card.innerHTML = `
        <div class="member-avatarWrap" style="
          position:absolute; top:-34px; left:50%; transform:translateX(-50%);
          width:86px; height:86px; border-radius:999px; padding:4px;
          background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.22);
        ">
          <img class="member-avatar" src="${m.photo || ""}" alt="${m.name || ""}" style="
            width:100%;height:100%;border-radius:999px;object-fit:cover;display:block;
          "/>
        </div>
        <div class="member-name" style="margin:8px 0 6px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:rgba(255,255,255,0.90);">
          ${m.name || ""}
        </div>
        <div class="member-role" style="font-size:.85rem;opacity:.78;margin-bottom:8px;">
          ${m.role || ""}
        </div>
        <div class="member-bio" style="font-size:.86rem;line-height:1.45;opacity:.86;text-align:left;">
          ${m.bio ? m.bio : ""}
        </div>
        <button class="bio-toggle">More</button>
      `;
      if ((m.name || '').toLowerCase().includes('taryn')) {
        card.classList.add('member--taryn');
      }
      grid.appendChild(card);
    });

  } catch (e) {
    console.error(e);
  }
})();

// Handle bio toggle (More/Less)
document.addEventListener('DOMContentLoaded', function() {
  const modal = document.getElementById('bioModal');

  // Open modal when clicking "More" button
  document.addEventListener('click', function(e) {
    if (e.target && e.target.classList.contains('bio-toggle')) {
      const card = e.target.closest('.member-card');
      if (card) {
        const nameEl = card.querySelector('.member-name');
        const roleEl = card.querySelector('.member-role');
        const photoEl = card.querySelector('.member-avatar');
        const bioEl = card.querySelector('.member-bio');

        document.getElementById('bioModalName').textContent = nameEl.textContent;
        document.getElementById('bioModalRole').textContent = roleEl.textContent;
        document.getElementById('bioModalPhoto').src = photoEl.src;
        document.getElementById('bioModalPhoto').alt = nameEl.textContent;
        
        // Extract full bio from data if available
        const fullBio = card.dataset.fullBio || bioEl.textContent;
        document.getElementById('bioModalBody').textContent = fullBio;

        modal.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }
    }
  });

  // Close modal functions
  function closeModal() {
    modal.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  // Close when clicking backdrop or close button
  document.addEventListener('click', function(e) {
    if (e.target && e.target.hasAttribute('data-close')) {
      closeModal();
    }
  });

  // Close on ESC key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('is-open')) {
      closeModal();
    }
  });
});
</script>

<style>
@media (max-width: 900px){
  #membersGrid { grid-template-columns: 1fr !important; }
}
</style>

</body>
</html>
