                - { label: "Label", name: "label", widget: "string", default: "2026" }
                - { label: "Cover (hub)", name: "cover", widget: "image", required: false }
                - label: "Galleries"
                  name: "galleries"
                  widget: "list"
                  fields:
                    - { label: "Section", name: "section", widget: "string" }
                    - { label: "Title", name: "title", widget: "string", required: false }
                    - label: "Images"
