backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings/global.json"
        label: "Global"
        name: "global"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string", default: "FOURPLAY Dance Band" }

  - name: "pages"
    label: "Pages"
    files:
      - file: "content/pages/home.md"
        label: "Home"
        name: "home"
      - file: "content/pages/contact.md"
        label: "Contact"
        name: "contact"

  - name: "members"
    label: "Band Members"
    format: "json"
    files:
      - file: "content/members.json"
        label: "Members Page"
        name: "members_page"

  - name: "artists"
    label: "Artists"
    folder: "content/artists"
    create: true
    format: "json"

  - name: "videos"
    label: "Videos"
    folder: "content/videos"
    create: true
    format: "json"

  # Photo entry folders (one JSON file per uploaded photo entry)
  - name: "photos_2026_entries"
    label: "Photos  2026 Entries"
    folder: "content/photos/2026"
    create: true
    format: "json"

  - name: "photos_2025_entries"
    label: "Photos  2025 Entries"
    folder: "content/photos/2025"
    create: true
    format: "json"

  - name: "photos_2024_entries"
    label: "Photos  2024 Entries"
    folder: "content/photos/2024"
    create: true
    format: "json"

  - name: "photos_2023_entries"
    label: "Photos  2023 Entries"
    folder: "content/photos/2023"
    create: true
    format: "json"

  - name: "photos_2020_2022_entries"
    label: "Photos  2020-2022 Entries"
    folder: "content/photos/2020-2022"
    create: true
    format: "json"

  - name: "photos_2016_2019_entries"
    label: "Photos  2016-2019 Entries"
    folder: "content/photos/2016-2019"
    create: true
    format: "json"

  # Single-file Years index for hub tiles (frontend reads this)
  - name: "photos_index"
    label: "Photos  Years Index"
    editor:
      preview: false
    files:
      - file: "content/photos/index.json"
        label: "Photos  Years Index (CMS)"
        name: "photos_years_master"
        fields:
          - label: "Years"
            name: "years"
            widget: "list"
            fields:
              - { label: "Year ID (slug)", name: "slug", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Cover Image", name: "cover", widget: "image" }

  - name: "schedule"
    label: "Schedule"
    folder: "content/schedule"
    create: true
    format: "json"
