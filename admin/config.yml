backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:

  - name: "settings"
    label: "Site Settings"
    editor:
      preview: false
    files:
      - file: "content/settings/global.json"
        label: "Global"
        name: "global"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string", default: "FOURPLAY Dance Band" }
          - { label: "Header Logo (optional)", name: "logo", widget: "image", required: false }
          - { label: "Footer Text (optional)", name: "footer", widget: "string", required: false }
          - { label: "Contact Email", name: "contact_email", widget: "string", required: false }

  - name: "pages"
    label: "Pages (Optional Text)"
    editor:
      preview: false
    files:
      - file: "content/pages/home.md"
        label: "Home"
        name: "home"
        fields:
          - { label: "Browser Title", name: "title", widget: "string", default: "FOURPLAY Dance Band" }
      - file: "content/pages/contact.md"
        label: "Contact"
        name: "contact"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Contact" }
          - { label: "Intro", name: "intro", widget: "text", required: false }

  - name: "members"
    label: "Band Members"
    format: "json"
    extension: "json"
    files:
      - file: "content/members.json"
        label: "Members Page"
        name: "members_page"
        fields:
          - { label: "Band Photo", name: "bandPhoto", widget: "image", required: false }
          - { label: "Band Bio", name: "bandBio", widget: "text", required: false }
          - label: "Members"
            name: "members"
            widget: "list"
            min: 1
            summary: "{{fields.name}} – {{fields.role}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role / Instrument", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Bio", name: "bio", widget: "text", required: false }

  - name: "artists"
    label: "Artists"
    folder: "content/artists"
    create: true
    format: "json"
    extension: "json"
    slug: "{{fields.order}}-{{slug}}"
    sortable_fields: ["order", "name"]
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Order (small first)", name: "order", widget: "number", value_type: "int", default: 1 }

  - name: "videos"
    label: "Videos"
    folder: "content/videos"
    create: true
    format: "json"
    extension: "json"
    slug: "{{fields.posted}}-{{slug}}"
    sortable_fields: ["posted", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Video URL (YouTube or MP4)", name: "url", widget: "string" }
      - { label: "Thumbnail (optional)", name: "thumbnail", widget: "image", required: false }

  - name: "photo_hubs"
    label: "Photos — Hubs"
    editor:
      preview: false
    files:
      - file: "content/photos/2026.json"
        label: "Photos — 2026 (Primary)"
        name: "photos_2026"
        fields:
          - { label: "Slug", name: "slug", widget: "string", default: "2026" }
          - { label: "Label", name: "label", widget: "string", default: "2026" }
          - { label: "Cover (hub)", name: "cover", widget: "image", required: false }
          - label: "Galleries"
            name: "galleries"
            widget: "list"
            fields:
              - { label: "Section", name: "section", widget: "string" }
              - { label: "Title", name: "title", widget: "string", required: false }
              - label: "Images"
                name: "images"
                widget: "list"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
                  - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - file: "content/photos/2025.json"
        label: "Photos — 2025"
        name: "photos_2025"
        fields:
          - { label: "Slug", name: "slug", widget: "string", default: "2025" }
