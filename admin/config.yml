backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "members"
    label: "Band Members"
    format: "json"
    extension: "json"
    files:
      - label: "Members Page"
        name: "members_page"
        file: "content/members.json"
        fields:
          - { label: "Band Photo", name: "bandPhoto", widget: "image", required: true }
          - { label: "Band Bio", name: "bandBio", widget: "text", required: false }

          - label: "Members (5)"
            name: "members"
            widget: "list"
            min: 1
            max: 5
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role / Instrument", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Bio", name: "bio", widget: "text", required: false }
