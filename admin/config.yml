        # Photos Hubs — replace per-entry collections with 6 hub files
        # Each file is content/photos/<slug>.json and contains: slug/label, cover, galleries:[{section,title,images:[{image,caption,subtitle,date}]}]
        - name: "photo_hubs"
          label: "Photos — Hubs"
          editor:
            preview: false
          files:
            - file: "content/photos/2026.json"
              label: "Photos — 2026 (Primary)"
              name: "photos_2026"
