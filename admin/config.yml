      # (index.json handled by dedicated collection below)
  # Dedicated single-file collection for the CMS-managed Years index with stable media folder
  - name: "photos_years"
    label: "Photos — Years Index (covers)"
    editor:
      preview: false
    media_folder: "uploads/photos/covers"
    public_folder: "/uploads/photos/covers"
    files:
      - file: "content/photos/index.json"
        label: "Photos — Years Index (CMS)"
        name: "photos_years_master"
        fields:
          - label: "Years"
            name: "years"
            widget: "list"
            fields:
              - { label: "Year ID (slug)", name: "year", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Cover Image", name: "cover", widget: "image" }
  # Schedule (Booked / Available)
  # Booked：可填写详情+海报；点开显示
  # Available：点开去 book（给一个 booking link）
  # ======================
  - name: "schedule"
    label: "Schedule"
    folder: "content/schedule"
    create: true
    format: "json"
    extension: "json"
    slug: "{{fields.date}}-{{slug}}"
    sortable_fields: ["date", "status", "venue"]
    fields:
      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        time_format: false

      - label: "Status"
        name: "status"
        widget: "select"
        options: ["available", "booked"]
        default: "available"

      # Booked details
      - { label: "Event Title (Booked)", name: "title", widget: "string", required: false }
      - label: "Start Time (optional)"
        name: "start_time"
        widget: "string"
        required: false
        hint: "Example: 8:00 PM"

      - { label: "Venue (Booked)", name: "venue", widget: "string", required: false }
      - { label: "Address (optional)", name: "address", widget: "string", required: false }
      - { label: "Note / Details (optional)", name: "note", widget: "text", required: false }

      - label: "Performers (optional)"
        name: "performers"
        widget: "list"
        required: false
        field: { label: "Name", name: "name", widget: "string" }

      - { label: "Poster Image (optional)", name: "poster", widget: "image", required: false }

      # Available click -> booking link
      - { label: "Booking Link (for Available)", name: "booking_link", widget: "string", required: false }
